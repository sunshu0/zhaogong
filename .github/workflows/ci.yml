# The same gate every line runs before pushing: `npm run check` (format, types, lint, unit tests, production
# build), then the Playwright browser tests on phone and desktop.
# Runs on GitHub Actions; until the organisation's Actions billing is sorted out it may not start (see README).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  check:
    name: npm run check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # playwright.config.ts starts `next dev` on this port when nothing is running there.
      E2E_PORT: "8702"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
